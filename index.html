<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side by Side - Photo Combiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.css" integrity="sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng=" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="shell">
        <header class="nav-edge">
            <a class="wordmark" href="./">
                <img class="wordmark-mark" src="logo.png" alt="" width="28" height="28">
                <span class="wordmark-title">Side by Side</span>
            </a>
            <a class="nav-source" href="https://github.com/dinhanhthi/side-by-side" target="_blank" rel="noopener noreferrer" data-tippy-content="View source on GitHub">Source</a>
        </header>

        <main class="bench">
            <div class="workspace">
                <div class="editor-stage" id="editorStage">
                    <canvas id="previewCanvas"></canvas>
                    <div class="cell-overlay" id="cellOverlay"></div>
                </div>
            </div>

            <aside class="controls-panel" aria-label="Options">
                <h2>Options</h2>

                <div class="control-group">
                    <label for="gridSelect">Grid layout</label>
                    <select id="gridSelect">
                        <option value="2,1">2 × 1</option>
                        <option value="1,2">1 × 2</option>
                        <option value="2,2">2 × 2</option>
                        <option value="3,2">3 × 2</option>
                        <option value="2,3">2 × 3</option>
                        <option value="3,3">3 × 3</option>
                    </select>
                    <div class="custom-grid">
                        <input type="number" id="customCols" value="2" min="1" max="6" aria-label="Columns">
                        <span>×</span>
                        <input type="number" id="customRows" value="1" min="1" max="6" aria-label="Rows">
                    </div>
                </div>

                <div class="control-group">
                    <label for="aspectSelect">Aspect ratio</label>
                    <select id="aspectSelect">
                        <option value="auto">Auto (from images)</option>
                        <option value="1:1">1:1 (Square)</option>
                        <option value="4:3">4:3</option>
                        <option value="3:2">3:2</option>
                        <option value="5:4">5:4</option>
                        <option value="16:9">16:9</option>
                        <option value="21:9">21:9 (Ultrawide)</option>
                        <option value="2:1">2:1</option>
                        <option value="3:4">3:4 (Portrait)</option>
                        <option value="2:3">2:3</option>
                        <option value="9:16">9:16</option>
                        <option value="4:5">4:5</option>
                        <option value="5:7">5:7</option>
                        <option value="1:2">1:2</option>
                    </select>
                </div>

                <div class="control-group" id="frameOrderGroup" style="display:none;">
                    <label>Frame order</label>
                    <div class="direction-toggle" id="frameOrderToggle">
                        <button type="button" class="direction-btn active" data-order="ltr" data-tippy-content="Left to right" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="8" height="16" rx="1.5" />
                                <rect x="14" y="4" width="8" height="16" rx="1.5" />
                                <path d="M9 12h6M13 9l3 3-3 3" />
                            </svg>
                            L → R
                        </button>
                        <button type="button" class="direction-btn" data-order="rtl" data-tippy-content="Right to left" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="8" height="16" rx="1.5" />
                                <rect x="14" y="4" width="8" height="16" rx="1.5" />
                                <path d="M15 12H9M11 9l-3 3 3 3" />
                            </svg>
                            R → L
                        </button>
                    </div>
                </div>

                <div class="control-group" id="diagonalGroup" style="display:none;">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="diagonalToggle">
                        <span class="checkbox-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                            </svg>
                        </span>
                        <span class="checkbox-label">Diagonal split</span>
                    </label>

                    <div id="diagonalDirSection" style="margin-top: 0.4rem; display: none;">
                        <label style="font-size: 0.68rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Direction</label>
                        <div class="direction-toggle" id="diagonalDirToggle">
                            <button class="direction-btn active" data-diag="tlbr" data-tippy-content="Top-left to bottom-right">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="2" width="20" height="20" rx="3" />
                                    <line x1="5" y1="5" x2="19" y2="19" />
                                </svg>
                            </button>
                            <button class="direction-btn" data-diag="trbl" data-tippy-content="Top-right to bottom-left">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="2" width="20" height="20" rx="3" />
                                    <line x1="19" y1="5" x2="5" y2="19" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="borderToggle">
                        <span class="checkbox-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                            </svg>
                        </span>
                        <span class="checkbox-label">Add Border</span>
                    </label>

                    <div class="border-options" id="borderOptions">
                        <div class="border-row">
                            <div class="border-field">
                                <label>Width (px)</label>
                                <div class="slider-wrapper">
                                    <input type="range" id="borderWidth" value="0" min="0" max="100">
                                    <span class="slider-value" id="borderWidthValue">0px</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-row">
                            <div class="border-field">
                                <label>Color</label>
                                <div class="color-input-wrapper">
                                    <input type="color" id="borderColor" value="#ffffff">
                                    <span class="color-hex" id="colorHex">#ffffff</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label class="checkbox-wrapper" data-tippy-content="When photos don't fill the frame, trim unused edges on download or copy">
                        <input type="checkbox" id="cropEmptyToggle">
                        <span class="checkbox-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                            </svg>
                        </span>
                        <span class="checkbox-label">Crop empty edges</span>
                    </label>
                    <p class="export-hint">Applies to Download and Copy</p>
                </div>

                <div class="panel-actions">
                    <button class="btn btn-primary" id="downloadBtn" data-tippy-content="Download the combined photo" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Download
                        <kbd class="shortcut-hint" id="shortcutHint">⌘D</kbd>
                    </button>

                    <button class="btn btn-secondary" id="copyBtn" data-tippy-content="Copy the combined photo" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span id="copyBtnLabel">Copy</span>
                    </button>
                </div>
            </aside>
        </main>

        <footer class="foot-line">
            <p>100% offline. No uploads, no tracking. Your photos never leave your device. Created by <a href="https://dinhanhthi.com" target="_blank" rel="noopener noreferrer">Anh-Thi DINH</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha256-whL0tQWoY1Ku1iskqPFvmZ+CHsvmRWx/PIoEvIeWh4I=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.umd.min.js" integrity="sha256-qx7gQMlSzXvTJCl8PBcHyzDQLGvX7NaFbiFY44WpsW4=" crossorigin="anonymous"></script>
    <script>
        // State
        let images = [null, null];
        let imageTransforms = [];
        let cols = 2;
        let rows = 1;
        let lastPastedSlot = null;
        let useDiagonal = false;
        let diagonalDirection = 'tlbr'; // 'tlbr' = top-left to bottom-right (\), 'trbl' = top-right to bottom-left (/)
        let frameOrder = 'ltr'; // 'ltr' = left→right (default), 'rtl' = right→left
        let aspectRatio = 'auto';
        let hasBorder = false;
        let borderWidth = 0;
        let borderColor = '#ffffff';
        let cropEmptyEdges = false;
        const MAX_DIM = 6;
        const MAX_TOTAL = 12;

        // DOM Elements
        const editorStage = document.getElementById('editorStage');
        const cellOverlay = document.getElementById('cellOverlay');
        const previewCanvas = document.getElementById('previewCanvas');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyBtnLabel = document.getElementById('copyBtnLabel');
        const borderToggle = document.getElementById('borderToggle');
        const borderOptions = document.getElementById('borderOptions');
        const borderWidthInput = document.getElementById('borderWidth');
        const borderColorInput = document.getElementById('borderColor');
        const colorHex = document.getElementById('colorHex');
        const gridSelect = document.getElementById('gridSelect');
        const customCols = document.getElementById('customCols');
        const customRows = document.getElementById('customRows');
        const aspectSelect = document.getElementById('aspectSelect');
        const frameOrderGroup = document.getElementById('frameOrderGroup');
        const frameOrderToggle = document.getElementById('frameOrderToggle');
        const diagonalGroup = document.getElementById('diagonalGroup');
        const diagonalToggle = document.getElementById('diagonalToggle');
        const diagonalDirToggle = document.getElementById('diagonalDirToggle');
        const diagonalDirSection = document.getElementById('diagonalDirSection');
        const cropEmptyToggle = document.getElementById('cropEmptyToggle');

        function cssColor(name) {
            const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            const probe = document.createElement('span');
            probe.style.color = raw;
            document.documentElement.appendChild(probe);
            const resolved = getComputedStyle(probe).color;
            probe.remove();
            return resolved || raw;
        }

        let paperFill = '';
        let wellFill = '';
        let inkStroke = '';
        function refreshThemeFills() {
            paperFill = cssColor('--color-paper');
            wellFill = cssColor('--color-well');
            inkStroke = cssColor('--color-ink');
        }
        refreshThemeFills();

        function setTip(el, text) {
            if (!el) return;
            el.setAttribute('data-tippy-content', text);
            if (el._tippy) el._tippy.setContent(text);
        }

        function destroyTips(root) {
            if (!root) return;
            root.querySelectorAll('[data-tippy-content]').forEach((el) => {
                if (el._tippy) el._tippy.destroy();
            });
        }

        if (typeof tippy === 'function' && tippy.delegate) {
            tippy.delegate(document.body, {
                target: '[data-tippy-content]',
                theme: 'sbs',
                delay: [800, 0],
                duration: [100, 80],
                arrow: true,
                appendTo: () => document.body,
                zIndex: 9999,
                allowHTML: false,
                touch: false,
                animation: 'fade',
            });
        }

        function getTotalSlots() {
            return cols * rows;
        }

        function defaultTransform() {
            return { scale: 1, panX: 0, panY: 0, flipX: false, flipY: false, rotate: 0, gray: false };
        }

        function syncGrayButton(btn, on) {
            if (!btn) return;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            setTip(btn, on ? 'Restore color' : 'Black and white');
        }

        // Build the transparent interaction grid that sits on top of the canvas.
        // Each cell handles click-to-upload, drag/drop, remove, and pan/zoom for its slot.
        function buildOverlay() {
            if (!cellOverlay) return;
            const total = getTotalSlots();

            cellOverlay.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            cellOverlay.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
            cellOverlay.classList.toggle('dense', total > 4);
            destroyTips(cellOverlay);
            cellOverlay.innerHTML = '';

            for (let i = 0; i < total; i++) {
                const cell = document.createElement('div');
                cell.className = 'overlay-cell';
                if (images[i]) cell.classList.add('has-image');
                const isGray = !!(imageTransforms[i] && imageTransforms[i].gray);

                if (total === 2 && !useDiagonal) {
                    const visualPosition = frameOrder === 'rtl' ? total - 1 - i : i;
                    cell.classList.add(visualPosition === 0 ? 'frame-left' : 'frame-right');
                }

                cell.innerHTML = `
                    <input type="file" accept="image/*">
                    <div class="upload-content">
                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="label">Photo ${i + 1}</p>
                        <p>Click, drag, or paste</p>
                    </div>
                    <button class="remove-image-btn" type="button" data-index="${i}" aria-label="Remove photo ${i + 1}" data-tippy-content="Remove photo" data-tippy-placement="bottom">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                    <div class="zoom-controls">
                        <button class="zoom-btn" type="button" data-zoom="out" aria-label="Zoom out photo ${i + 1}" data-tippy-content="Zoom out">&minus;</button>
                        <button class="zoom-btn" type="button" data-zoom="in" aria-label="Zoom in photo ${i + 1}" data-tippy-content="Zoom in">+</button>
                        <button class="zoom-btn" type="button" data-flip="h" aria-label="Flip photo ${i + 1} horizontally" data-tippy-content="Flip horizontal">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 7 4 12l4 5"/>
                                <path d="m16 7 4 5-4 5"/>
                                <path d="M12 4v16"/>
                            </svg>
                        </button>
                        <button class="zoom-btn" type="button" data-flip="v" aria-label="Flip photo ${i + 1} vertically" data-tippy-content="Flip vertical">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m7 8 5-4 5 4"/>
                                <path d="m7 16 5 4 5-4"/>
                                <path d="M4 12h16"/>
                            </svg>
                        </button>
                        <button class="zoom-btn" type="button" data-rotate="ccw" aria-label="Rotate photo ${i + 1} anti-clockwise" data-tippy-content="Rotate anti-clockwise">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                        </button>
                        <button class="zoom-btn" type="button" data-rotate="cw" aria-label="Rotate photo ${i + 1} clockwise" data-tippy-content="Rotate clockwise">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                                <path d="M21 3v5h-5"/>
                            </svg>
                        </button>
                        <button class="zoom-btn${isGray ? ' active' : ''}" type="button" data-gray aria-pressed="${isGray ? 'true' : 'false'}" aria-label="Toggle black and white on photo ${i + 1}" data-tippy-content="${isGray ? 'Restore color' : 'Black and white'}">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"/>
                                <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
                            </svg>
                        </button>
                        <span class="zoom-sep" aria-hidden="true"></span>
                        <button class="zoom-btn" type="button" data-export="download" aria-label="Download photo ${i + 1}" data-tippy-content="Download photo">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                        </button>
                        <button class="zoom-btn" type="button" data-export="copy" aria-label="Copy photo ${i + 1}" data-tippy-content="Copy photo">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                        </button>
                    </div>
                `;

                const fileInput = cell.querySelector('input[type="file"]');
                const removeBtn = cell.querySelector('.remove-image-btn');

                cell.addEventListener('click', (e) => {
                    if (e.target.closest('.remove-image-btn')) return;
                    if (images[i]) return; // filled → drag to pan instead of re-uploading
                    fileInput.click();
                });

                cell.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    cell.classList.add('drag-over');
                });
                cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
                cell.addEventListener('drop', (e) => {
                    e.preventDefault();
                    cell.classList.remove('drag-over');
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) loadFileToSlot(file, i);
                });

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) loadFileToSlot(file, i);
                });

                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImage(i);
                });

                // Match visual position when frame order is reversed (2-slot only)
                if (total === 2 && frameOrder === 'rtl') {
                    cell.style.order = String(total - 1 - i);
                }

                attachCellInteractivity(cell, i);
                cellOverlay.appendChild(cell);
            }

            syncOverlay();
        }

        // Toggle per-cell filled state and match the overlay gap to the border thickness.
        function syncOverlay() {
            if (!cellOverlay) return;
            cellOverlay.querySelectorAll('.overlay-cell').forEach((cell, i) => {
                cell.classList.toggle('has-image', !!images[i]);
            });
            const border = hasBorder ? borderWidth : 0;
            const rect = previewCanvas.getBoundingClientRect();
            const scale = (rect.width && previewCanvas.width) ? rect.width / previewCanvas.width : 0;
            const gapPx = border * scale;
            cellOverlay.style.gap = gapPx + 'px';
            cellOverlay.style.padding = gapPx + 'px';
        }

        // Pan / zoom / reset for a slot, operating in target-canvas pixels so the
        // on-screen preview equals the exported image exactly (single coordinate space).
        function attachCellInteractivity(cell, index) {
            const scaleFactor = () => {
                const rect = previewCanvas.getBoundingClientRect();
                return rect.width ? (previewCanvas.width / rect.width) : 1;
            };
            const ensureT = () => {
                let t = imageTransforms[index];
                if (!t) { t = defaultTransform(); imageTransforms[index] = t; }
                return t;
            };

            // Same math as the wheel handler with the anchor at the cell centre.
            const zoomBy = (factor) => {
                if (!images[index]) return;
                const t = ensureT();
                const newScale = Math.max(0.15, Math.min(10, t.scale * factor));
                const ratio = newScale / t.scale;
                t.panX *= ratio;
                t.panY *= ratio;
                t.scale = newScale;
                renderCanvas();
            };

            cell.querySelectorAll('[data-zoom]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    zoomBy(btn.dataset.zoom === 'in' ? 1.05 : 1 / 1.05);
                });
            });

            cell.querySelectorAll('[data-flip]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!images[index]) return;
                    const t = ensureT();
                    if (btn.dataset.flip === 'v') t.flipY = !t.flipY;
                    else t.flipX = !t.flipX;
                    renderCanvas();
                });
            });

            cell.querySelectorAll('[data-rotate]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!images[index]) return;
                    const t = ensureT();
                    const step = btn.dataset.rotate === 'cw' ? 90 : -90;
                    t.rotate = (((t.rotate || 0) + step) % 360 + 360) % 360;
                    renderCanvas();
                });
            });

            const grayBtn = cell.querySelector('[data-gray]');
            if (grayBtn) {
                grayBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!images[index]) return;
                    const t = ensureT();
                    t.gray = !t.gray;
                    syncGrayButton(grayBtn, t.gray);
                    renderCanvas();
                });
            }

            const downloadPhotoBtn = cell.querySelector('[data-export="download"]');
            if (downloadPhotoBtn) {
                downloadPhotoBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadCellImage(index);
                });
            }

            const copyPhotoBtn = cell.querySelector('[data-export="copy"]');
            if (copyPhotoBtn) {
                copyPhotoBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyCellImage(index, copyPhotoBtn);
                });
            }

            cell.addEventListener('wheel', (e) => {
                if (!images[index] || !currentLayout) return;
                e.preventDefault();
                const t = ensureT();
                const S = scaleFactor();
                const rect = previewCanvas.getBoundingClientRect();
                const cr = currentLayout.cells[index];
                const tx = (e.clientX - rect.left) * S;
                const ty = (e.clientY - rect.top) * S;
                const mx = tx - (cr.x + cr.w / 2);
                const my = ty - (cr.y + cr.h / 2);
                const factor = e.deltaY < 0 ? 1.12 : 0.89;
                const oldScale = t.scale;
                const newScale = Math.max(0.15, Math.min(10, oldScale * factor));
                const ratio = newScale / oldScale;
                t.panX = mx - (mx - t.panX) * ratio;
                t.panY = my - (my - t.panY) * ratio;
                t.scale = newScale;
                renderCanvas();
            }, { passive: false });

            let dragging = false, sx = 0, sy = 0, spx = 0, spy = 0, S = 1;
            const move = (e) => {
                if (!dragging) return;
                const t = ensureT();
                t.panX = spx + (e.clientX - sx) * S;
                t.panY = spy + (e.clientY - sy) * S;
                renderCanvas();
            };
            const up = () => {
                dragging = false;
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
            };
            cell.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || !images[index]) return;
                if (e.target.closest('.remove-image-btn') || e.target.closest('.zoom-controls')) return;
                const t = ensureT();
                dragging = true;
                sx = e.clientX; sy = e.clientY; spx = t.panX; spy = t.panY;
                S = scaleFactor();
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
            });
            cell.addEventListener('dblclick', (e) => {
                if (!images[index]) return;
                if (e.target.closest('.zoom-controls')) return;
                e.stopPropagation();
                imageTransforms[index] = defaultTransform();
                syncGrayButton(cell.querySelector('[data-gray]'), false);
                renderCanvas();
            });
        }

        function loadImageToSlot(index, dataUrl) {
            const img = new Image();
            img.onload = () => {
                images[index] = img;
                imageTransforms[index] = defaultTransform();
                syncOverlay();
                updateUI();
            };
            img.src = dataUrl;
        }

        function loadFileToSlot(file, index) {
            const reader = new FileReader();
            reader.onload = (e) => loadImageToSlot(index, e.target.result);
            reader.readAsDataURL(file);
        }

        function removeImage(index) {
            images[index] = null;
            imageTransforms[index] = null;
            const cell = cellOverlay.querySelectorAll('.overlay-cell')[index];
            if (cell) {
                const fileInput = cell.querySelector('input[type="file"]');
                if (fileInput) fileInput.value = '';
            }
            syncOverlay();
            updateUI();
        }

        function getPasteTargetSlot() {
            const total = getTotalSlots();
            // Find first empty
            for (let i = 0; i < total; i++) {
                if (!images[i]) return i;
            }
            // All full: cycle from last
            if (lastPastedSlot == null) return 0;
            return (lastPastedSlot + 1) % total;
        }

        function handleClipboardImage(blob) {
            const slot = getPasteTargetSlot();
            const total = getTotalSlots();
            if (slot >= total) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                loadImageToSlot(slot, e.target.result);
                lastPastedSlot = slot;
            };
            reader.readAsDataURL(blob);
        }

        function hasAnyImage() {
            const total = getTotalSlots();
            return images.slice(0, total).some(img => !!img);
        }

        function updateUI() {
            const total = getTotalSlots();
            const hasAll = images.slice(0, total).every(img => !!img);
            renderCanvas();
            downloadBtn.disabled = !hasAll;
            copyBtn.disabled = !hasAll;
            updateFrameOrderEnabled();
        }

        // Compute the composition layout in target-canvas pixels.
        // Returns { canvasW, canvasH, border, diagonal, cells:[{x,y,w,h}] }.
        function computeLayout() {
            const total = getTotalSlots();
            const border = hasBorder ? borderWidth : 0;

            let refImgs = images.slice(0, total).filter(Boolean);
            if (refImgs.length === 0) refImgs = [{ width: 600, height: 400 }];

            const size = getTargetCanvasSize(refImgs, cols, rows, border, aspectRatio);
            const innerW = size.width;
            const innerH = size.height;

            if (total === 2 && useDiagonal) {
                // one combined rect split diagonally; both slots share the full area
                const rect = { x: border, y: border, w: innerW, h: innerH };
                return {
                    canvasW: innerW + border * 2,
                    canvasH: innerH + border * 2,
                    border, diagonal: true,
                    cells: [rect, rect]
                };
            }

            const cellW = innerW / cols;
            const cellH = innerH / rows;
            const cells = [];
            for (let i = 0; i < total; i++) {
                // RTL reverses which screen position each slot occupies (2-frame only)
                const pos = (total === 2 && frameOrder === 'rtl') ? (total - 1 - i) : i;
                const r = Math.floor(pos / cols);
                const c = pos % cols;
                cells.push({
                    x: border + c * (cellW + border),
                    y: border + r * (cellH + border),
                    w: cellW, h: cellH
                });
            }
            return {
                canvasW: innerW + (cols + 1) * border,
                canvasH: innerH + (rows + 1) * border,
                border, diagonal: false, cells
            };
        }

        // Cover-fit + transform metrics for one image inside a cell (shared by draw + crop).
        function getCellDrawMetrics(img, rect, t) {
            const tr = t || defaultTransform();
            const rot = ((tr.rotate % 360) + 360) % 360;
            const swapped = rot === 90 || rot === 270;
            const srcW = swapped ? img.height : img.width;
            const srcH = swapped ? img.width : img.height;
            const base = Math.max(rect.w / srcW, rect.h / srcH) || 1;
            const ds = base * tr.scale;
            const dw = img.width * ds;
            const dh = img.height * ds;
            const cx = rect.x + rect.w / 2 + tr.panX;
            const cy = rect.y + rect.h / 2 + tr.panY;
            return { tr, rot, dw, dh, cx, cy, swapped };
        }

        // Draw one image inside a rect using cover-fit (fill + crop) + its transform.
        function drawCellImage(ctx, img, rect, t) {
            const { tr, rot, dw, dh, cx, cy } = getCellDrawMetrics(img, rect, t);
            ctx.save();
            ctx.translate(cx, cy);
            if (rot) ctx.rotate(rot * Math.PI / 180);
            if (tr.flipX || tr.flipY) ctx.scale(tr.flipX ? -1 : 1, tr.flipY ? -1 : 1);
            if (tr.gray) ctx.filter = 'grayscale(1)';
            ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
        }

        function intersectRects(a, b) {
            const x = Math.max(a.x, b.x);
            const y = Math.max(a.y, b.y);
            const r = Math.min(a.x + a.w, b.x + b.w);
            const btm = Math.min(a.y + a.h, b.y + b.h);
            if (r <= x || btm <= y) return null;
            return { x, y, w: r - x, h: btm - y };
        }

        function getImageDrawBounds(img, rect, t) {
            const { dw, dh, cx, cy, swapped } = getCellDrawMetrics(img, rect, t);
            const boxW = swapped ? dh : dw;
            const boxH = swapped ? dw : dh;
            return { x: cx - boxW / 2, y: cy - boxH / 2, w: boxW, h: boxH };
        }

        // Insets from cell edges to the visible photo (after clip). Empty if the photo is off-cell.
        function getCellContentInsets(img, rect, t) {
            const clipped = intersectRects(getImageDrawBounds(img, rect, t), rect);
            if (!clipped) return { left: rect.w, right: 0, top: rect.h, bottom: 0 };
            return {
                left: clipped.x - rect.x,
                top: clipped.y - rect.y,
                right: (rect.x + rect.w) - (clipped.x + clipped.w),
                bottom: (rect.y + rect.h) - (clipped.y + clipped.h)
            };
        }

        // Tightest crop that still keeps every cell filled — same trim on every cell so alignment stays.
        function getCommonContentInsets(layout) {
            const total = getTotalSlots();
            let left = 0, right = 0, top = 0, bottom = 0;
            let found = false;
            for (let i = 0; i < total; i++) {
                if (!images[i]) continue;
                const ins = getCellContentInsets(images[i], layout.cells[i], imageTransforms[i]);
                if (!found) {
                    left = ins.left;
                    right = ins.right;
                    top = ins.top;
                    bottom = ins.bottom;
                    found = true;
                } else {
                    left = Math.max(left, ins.left);
                    right = Math.max(right, ins.right);
                    top = Math.max(top, ins.top);
                    bottom = Math.max(bottom, ins.bottom);
                }
            }
            return { left, right, top, bottom };
        }

        function ceilInset(value) {
            if (value < 0.5) return 0;
            return Math.ceil(value);
        }

        // Canvas used by Download / Copy. Optionally stitches each cell after trimming unused edges.
        function buildExportCanvas() {
            if (!cropEmptyEdges) return previewCanvas;

            const L = currentLayout || computeLayout();
            const inset = getCommonContentInsets(L);
            const trimL = ceilInset(inset.left);
            const trimT = ceilInset(inset.top);
            const trimR = ceilInset(inset.right);
            const trimB = ceilInset(inset.bottom);
            if (trimL + trimT + trimR + trimB === 0) return previewCanvas;

            const srcCell = L.cells[0];
            const newCellW = Math.floor(srcCell.w - trimL - trimR);
            const newCellH = Math.floor(srcCell.h - trimT - trimB);
            if (newCellW < 1 || newCellH < 1) return previewCanvas;

            const border = L.border;
            const out = document.createElement('canvas');
            const ctx = out.getContext('2d');

            if (L.diagonal) {
                out.width = newCellW + border * 2;
                out.height = newCellH + border * 2;
                ctx.fillStyle = hasBorder ? borderColor : paperFill;
                ctx.fillRect(0, 0, out.width, out.height);
                ctx.drawImage(
                    previewCanvas,
                    srcCell.x + trimL, srcCell.y + trimT, newCellW, newCellH,
                    border, border, newCellW, newCellH
                );
                return out;
            }

            const innerW = cols * newCellW;
            const innerH = rows * newCellH;
            out.width = Math.max(1, Math.round(innerW + (cols + 1) * border));
            out.height = Math.max(1, Math.round(innerH + (rows + 1) * border));
            ctx.fillStyle = hasBorder ? borderColor : paperFill;
            ctx.fillRect(0, 0, out.width, out.height);

            const gapX = srcCell.w + border;
            const gapY = srcCell.h + border;
            const total = getTotalSlots();
            for (let i = 0; i < total; i++) {
                const src = L.cells[i];
                const c = gapX ? Math.round((src.x - border) / gapX) : 0;
                const r = gapY ? Math.round((src.y - border) / gapY) : 0;
                const dx = border + c * (newCellW + border);
                const dy = border + r * (newCellH + border);
                ctx.drawImage(
                    previewCanvas,
                    src.x + trimL, src.y + trimT, newCellW, newCellH,
                    dx, dy, newCellW, newCellH
                );
            }
            return out;
        }

        // Rasterize one slot as currently framed (zoom / pan / flip / rotate + cell clip).
        function buildCellExportCanvas(index) {
            const img = images[index];
            if (!img) return null;
            const L = currentLayout || computeLayout();
            const rect = L.cells[index];
            if (!rect || rect.w < 1 || rect.h < 1) return null;

            const t = imageTransforms[index];
            let cropX = 0, cropY = 0, cropW = rect.w, cropH = rect.h;
            if (cropEmptyEdges) {
                const ins = getCellContentInsets(img, rect, t);
                const trimL = ceilInset(ins.left);
                const trimT = ceilInset(ins.top);
                const trimR = ceilInset(ins.right);
                const trimB = ceilInset(ins.bottom);
                cropX = trimL;
                cropY = trimT;
                cropW = Math.floor(rect.w - trimL - trimR);
                cropH = Math.floor(rect.h - trimT - trimB);
                if (cropW < 1 || cropH < 1) return null;
            }

            const out = document.createElement('canvas');
            out.width = Math.max(1, Math.round(cropW));
            out.height = Math.max(1, Math.round(cropH));
            const ctx = out.getContext('2d');
            ctx.save();
            ctx.translate(-rect.x - cropX, -rect.y - cropY);
            ctx.beginPath();
            ctx.rect(rect.x, rect.y, rect.w, rect.h);
            ctx.clip();
            drawCellImage(ctx, img, rect, t);
            ctx.restore();
            return out;
        }

        function downloadCellImage(index) {
            const canvas = buildCellExportCanvas(index);
            if (!canvas) return;
            const link = document.createElement('a');
            const suffix = Math.random().toString(36).slice(2, 7);
            link.download = `photo-${index + 1}-${suffix}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        const cellCopyTimeouts = new WeakMap();

        async function copyCellImage(index, btn) {
            const canvas = buildCellExportCanvas(index);
            if (!canvas) return;
            const defaultTitle = 'Copy photo';
            try {
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((result) => {
                        if (result) resolve(result);
                        else reject(new Error('Failed to create image blob'));
                    }, 'image/png');
                });
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                if (btn) {
                    btn.classList.add('copied');
                    setTip(btn, 'Copied!');
                    clearTimeout(cellCopyTimeouts.get(btn));
                    const tid = setTimeout(() => {
                        btn.classList.remove('copied');
                        setTip(btn, defaultTitle);
                    }, 2000);
                    cellCopyTimeouts.set(btn, tid);
                }
            } catch (err) {
                console.error('Failed to copy photo:', err);
                if (btn) {
                    setTip(btn, 'Copy failed');
                    clearTimeout(cellCopyTimeouts.get(btn));
                    const tid = setTimeout(() => {
                        setTip(btn, defaultTitle);
                    }, 2000);
                    cellCopyTimeouts.set(btn, tid);
                }
            }
        }

        let currentLayout = null;

        // Render the whole composition to the canvas (any fill state: none, some, or all).
        // Empty cells get a neutral backdrop; the overlay shows their upload hint on top.
        function renderCanvas() {
            const total = getTotalSlots();
            const L = computeLayout();
            currentLayout = L;

            const ctx = previewCanvas.getContext('2d');
            previewCanvas.width = Math.max(1, Math.round(L.canvasW));
            previewCanvas.height = Math.max(1, Math.round(L.canvasH));

            ctx.fillStyle = hasBorder ? borderColor : paperFill;
            ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

            if (L.diagonal) {
                const { x: ix, y: iy, w: iw, h: ih } = L.cells[0];
                const tris = diagonalDirection === 'tlbr'
                    ? [ [[ix,iy],[ix+iw,iy+ih],[ix,iy+ih]], [[ix,iy],[ix+iw,iy],[ix+iw,iy+ih]] ]
                    : [ [[ix,iy],[ix+iw,iy],[ix,iy+ih]], [[ix+iw,iy],[ix+iw,iy+ih],[ix,iy+ih]] ];
                for (let i = 0; i < 2; i++) {
                    // Frame order swaps which photo lands in which triangle half
                    const imgIndex = frameOrder === 'rtl' ? (1 - i) : i;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(tris[i][0][0], tris[i][0][1]);
                    ctx.lineTo(tris[i][1][0], tris[i][1][1]);
                    ctx.lineTo(tris[i][2][0], tris[i][2][1]);
                    ctx.closePath();
                    ctx.clip();
                    ctx.fillStyle = wellFill;
                    ctx.fillRect(ix, iy, iw, ih);
                    if (images[imgIndex]) drawCellImage(ctx, images[imgIndex], L.cells[i], imageTransforms[imgIndex]);
                    ctx.restore();
                }
                ctx.strokeStyle = hasBorder ? borderColor : inkStroke;
                ctx.lineWidth = L.border > 0 ? L.border : Math.max(2, L.canvasW * 0.004);
                ctx.beginPath();
                if (diagonalDirection === 'tlbr') { ctx.moveTo(ix, iy); ctx.lineTo(ix + iw, iy + ih); }
                else { ctx.moveTo(ix + iw, iy); ctx.lineTo(ix, iy + ih); }
                ctx.stroke();
            } else {
                for (let i = 0; i < total; i++) {
                    const rect = L.cells[i];
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(rect.x, rect.y, rect.w, rect.h);
                    ctx.clip();
                    if (images[i]) {
                        drawCellImage(ctx, images[i], rect, imageTransforms[i]);
                    } else {
                        ctx.fillStyle = wellFill;
                        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                    }
                    ctx.restore();
                }
            }

            syncOverlay();
        }

        function setLayout(newCols, newRows) {
            let c = Math.max(1, Math.min(MAX_DIM, Math.floor(newCols) || 1));
            let r = Math.max(1, Math.min(MAX_DIM, Math.floor(newRows) || 1));
            let t = c * r;
            if (t > MAX_TOTAL) {
                while (t > MAX_TOTAL && r > 1) { r--; t = c * r; }
                while (t > MAX_TOTAL && c > 1) { c--; t = c * r; }
            }
            cols = c;
            rows = r;

            const newTotal = c * r;
            // Adjust images and transforms array length
            if (newTotal > images.length) {
                while (images.length < newTotal) images.push(null);
                while (imageTransforms.length < newTotal) imageTransforms.push(null);
            } else {
                images = images.slice(0, newTotal);
                imageTransforms = imageTransforms.slice(0, newTotal);
            }

            // Sync UI controls
            const presetVal = `${c},${r}`;
            if (gridSelect) {
                const hasOpt = Array.from(gridSelect.options).some(o => o.value === presetVal);
                gridSelect.value = hasOpt ? presetVal : '';
            }
            if (customCols) customCols.value = c;
            if (customRows) customRows.value = r;
            if (aspectSelect) aspectSelect.value = aspectRatio;

            // Cell geometry changed → reset pan/zoom so photos re-fit cleanly (no jump)
            resetTransforms();

            updateFrameOrderVisibility();
            updateDiagonalVisibility();
            buildOverlay();
            updateUI();
        }

        // Reset every loaded photo's pan/zoom to the default cover-fit
        function resetTransforms() {
            imageTransforms = images.map(im => im ? defaultTransform() : null);
        }

        function updateFrameOrderVisibility() {
            const isTwo = getTotalSlots() === 2;
            if (frameOrderGroup) {
                frameOrderGroup.style.display = isTwo ? 'block' : 'none';
            }
            if (isTwo) {
                syncFrameOrderUI();
                updateFrameOrderEnabled();
            }
        }

        function syncFrameOrderUI() {
            if (!frameOrderToggle) return;
            frameOrderToggle.querySelectorAll('.direction-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.order === frameOrder);
            });
        }

        function updateFrameOrderEnabled() {
            if (!frameOrderToggle) return;
            const enabled = getTotalSlots() === 2 && hasAnyImage();
            frameOrderToggle.classList.toggle('disabled', !enabled);
            frameOrderToggle.querySelectorAll('.direction-btn').forEach(btn => {
                btn.disabled = !enabled;
            });
        }

        function updateDiagonalVisibility() {
            const total = getTotalSlots();
            const isTwo = total === 2;
            if (diagonalGroup) {
                diagonalGroup.style.display = isTwo ? 'block' : 'none';
            }
            if (!isTwo) {
                useDiagonal = false;
                if (diagonalToggle) diagonalToggle.checked = false;
                if (diagonalDirSection) diagonalDirSection.style.display = 'none';
            } else {
                // keep previous direction choice when returning to 2-photo grid
                syncDiagonalDirectionUI();
                if (diagonalDirSection) {
                    diagonalDirSection.style.display = (diagonalToggle && diagonalToggle.checked) ? 'block' : 'none';
                }
            }
        }

        function syncDiagonalDirectionUI() {
            if (!diagonalDirToggle) return;
            diagonalDirToggle.querySelectorAll('.direction-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diag === diagonalDirection);
            });
        }

        // Grid layout controls
        if (gridSelect) {
            gridSelect.addEventListener('change', () => {
                const val = gridSelect.value;
                const [c, r] = val.split(',').map(Number);
                setLayout(c, r);
            });
        }

        function applyCustomFromInputs() {
            const c = parseInt(customCols.value);
            const r = parseInt(customRows.value);
            if (!isNaN(c) && !isNaN(r)) {
                setLayout(c, r);
            }
        }

        if (customCols) customCols.addEventListener('input', applyCustomFromInputs);
        if (customRows) customRows.addEventListener('input', applyCustomFromInputs);

        if (aspectSelect) {
            aspectSelect.addEventListener('change', () => {
                aspectRatio = aspectSelect.value;
                resetTransforms();
                updateUI();
            });
        }

        if (diagonalToggle) {
            diagonalToggle.addEventListener('change', () => {
                useDiagonal = diagonalToggle.checked;
                if (diagonalDirSection) {
                    diagonalDirSection.style.display = useDiagonal ? 'block' : 'none';
                }
                updateUI();
            });
        }

        // Frame order buttons (2-slot L→R / R→L)
        if (frameOrderToggle) {
            frameOrderToggle.querySelectorAll('.direction-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    const next = btn.dataset.order;
                    if (next === frameOrder) return;
                    frameOrder = next;
                    syncFrameOrderUI();
                    // Rebuild overlay so cell order matches canvas positions
                    buildOverlay();
                    updateUI();
                });
            });
        }

        // Diagonal direction buttons
        if (diagonalDirToggle) {
            diagonalDirToggle.querySelectorAll('.direction-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    diagonalDirToggle.querySelectorAll('.direction-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diagonalDirection = btn.dataset.diag;
                    updateUI();
                });
            });
        }

        // Border toggle
        borderToggle.addEventListener('change', () => {
            hasBorder = borderToggle.checked;
            borderOptions.classList.toggle('visible', hasBorder);
            updateUI();
        });

        const borderWidthValue = document.getElementById('borderWidthValue');

        function updateSliderProgress() {
            const min = borderWidthInput.min || 1;
            const max = borderWidthInput.max || 100;
            const val = borderWidthInput.value;
            const progress = ((val - min) / (max - min)) * 100;
            borderWidthInput.style.setProperty('--progress', progress + '%');
        }
        updateSliderProgress();

        borderWidthInput.addEventListener('input', () => {
            borderWidth = parseInt(borderWidthInput.value) || 0;
            borderWidthValue.textContent = borderWidth + 'px';
            updateSliderProgress();
            updateUI();
        });

        borderColorInput.addEventListener('input', () => {
            borderColor = borderColorInput.value;
            colorHex.textContent = borderColor;
            updateUI();
        });

        if (cropEmptyToggle) {
            cropEmptyToggle.addEventListener('change', () => {
                cropEmptyEdges = cropEmptyToggle.checked;
            });
        }

        function getTargetCanvasSize(loaded, cols, rows, border, aspectStr) {
            // aspectStr means the aspect ratio of the final combined photo (the whole result)
            const aspect = (aspectStr && aspectStr !== 'auto') ? aspectStr : null;

            let ref = 600;
            for (const im of loaded) {
                ref = Math.max(ref, Math.max(im.width || 0, im.height || 0));
            }
            ref = Math.max(ref, 400);

            if (!aspect) {
                // auto: cell size based on max dims across images (as before)
                let cellW = 0, cellH = 0;
                for (const im of loaded) {
                    cellW = Math.max(cellW, im.width || 0);
                    cellH = Math.max(cellH, im.height || 0);
                }
                if (cellW === 0) cellW = 600;
                if (cellH === 0) cellH = 400;
                const innerW = cols * cellW;
                const innerH = rows * cellH;
                return { width: innerW, height: innerH };
            }

            // fixed overall aspect: the whole inner area (before borders) matches cw:ch
            const [cw, ch] = aspect.split(':').map(n => parseFloat(n) || 1);
            const overallAspect = cw / ch;

            // base resolution on ref scaled by column count for reasonable cell size
            const innerW = ref * cols;
            const innerH = innerW / overallAspect;
            return { width: innerW, height: innerH };
        }


        // Download
        function downloadResult() {
            if (downloadBtn.disabled) return;
            const canvas = buildExportCanvas();
            const link = document.createElement('a');
            const suffix = Math.random().toString(36).slice(2, 7);
            link.download = `combined-photo-${suffix}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        downloadBtn.addEventListener('click', downloadResult);

        // Copy to clipboard
        let copyFeedbackTimeout = null;

        async function copyResult() {
            if (copyBtn.disabled) return;

            try {
                const canvas = buildExportCanvas();
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((result) => {
                        if (result) resolve(result);
                        else reject(new Error('Failed to create image blob'));
                    }, 'image/png');
                });

                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);

                copyBtn.dataset.state = 'success';
                copyBtnLabel.textContent = 'Copied!';
                setTip(copyBtn, 'Copied!');
                clearTimeout(copyFeedbackTimeout);
                copyFeedbackTimeout = setTimeout(() => {
                    delete copyBtn.dataset.state;
                    copyBtnLabel.textContent = 'Copy';
                    setTip(copyBtn, 'Copy the combined photo');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy image:', err);
                copyBtn.dataset.state = 'error';
                copyBtnLabel.textContent = 'Copy failed';
                setTip(copyBtn, 'Copy failed');
                clearTimeout(copyFeedbackTimeout);
                copyFeedbackTimeout = setTimeout(() => {
                    delete copyBtn.dataset.state;
                    copyBtnLabel.textContent = 'Copy';
                    setTip(copyBtn, 'Copy the combined photo');
                }, 2000);
            }
        }

        copyBtn.addEventListener('click', copyResult);

        // Paste image from clipboard into the next empty slot (cycles if full)
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    if (!blob) return;

                    e.preventDefault();
                    handleClipboardImage(blob);
                    return;
                }
            }
        });

        // Keyboard shortcut: Cmd+D (Mac) / Ctrl+D (Win/Linux)
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
                e.preventDefault();
                downloadResult();
            }
        });

        // Keep the overlay aligned to the canvas as it scales with the viewport
        window.addEventListener('resize', syncOverlay);

        // Initialize overlay and grid UI
        function initGridUI() {
            if (gridSelect) gridSelect.value = `${cols},${rows}`;
            if (customCols) customCols.value = cols;
            if (customRows) customRows.value = rows;
            if (aspectSelect) aspectSelect.value = aspectRatio;
            syncFrameOrderUI();
            updateFrameOrderVisibility();
            syncDiagonalDirectionUI();
            updateDiagonalVisibility();
            buildOverlay();
            updateUI();
        }

        initGridUI();

        // Detect OS for shortcut hint
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const shortcutHint = document.getElementById('shortcutHint');
        shortcutHint.textContent = isMac ? '⌘D' : 'Ctrl+D';
    </script>
</body>
</html>
